name: app

# Swift packages and the app build on macOS, only when app or protocol code changes (PLAN.md §8.1).
# UI tests are not run here; they are part of local `make verify`.
on:
  pull_request:
    paths:
      - "app/**"
      - "engine/packages/protocol/**"
      - "engine/tools/swift-codegen/**"
      - "engine/tools/protocol-schema/**"
      - "engine/packages/server/tests/processes/fake-picad.ts"
      - "Makefile"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # AppShell's tests start `picad` with a FakeRuntime (A-01), so the engine's packages are installed.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engine/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml
      # A-10: SwiftTerm compiles a Metal shader; Xcode 26 and later ship the Metal Toolchain as a separate component.
      - name: Metal Toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: make -k verify-app
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: app/Packages/*/.snapshot-failures/
          if-no-files-found: ignore
          include-hidden-files: true
